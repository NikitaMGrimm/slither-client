<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SlitherClient scene</title>
<link rel="stylesheet" href="/scene/scene.css">
<main>
  <h1>SlitherClient</h1>
  <div class="controls">
    <button id="reset">Synthetic scene</button>
    <button id="step">Step</button>
    <label>Palette <select id="skin"><option value="0">Mint</option><option value="1">Amber</option><option value="2">Blue</option></select></label>
    <label>Zoom <select id="zoom"><option value="1">1×</option><option value="1.5" selected>1.5×</option><option value="2">2×</option></select></label>
    <label><input id="follow" type="checkbox" checked>Follow</label>
    <button id="connect" disabled>Connect local simulator</button>
    <button id="disconnect" disabled>Disconnect</button>
  </div>
  <canvas id="scene" width="960" height="540" tabindex="0" aria-label="Client world scene"></canvas>
  <output id="counts"></output>
  <p id="status" role="status">Loading Wasm…</p>
  <p class="hint">Synthetic fixtures · Pointer aims in local mode · Hold Space to boost</p>
</main>
<script type="module" src="/scene/scene.mjs"></script>
</html>
