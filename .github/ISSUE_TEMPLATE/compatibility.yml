name: Compatibility investigation
description: Propose or document a bounded client compatibility check.
title: "compatibility: "
body:
  - type: markdown
    attributes:
      value: |
        Limit the report to the behavior checked and distinguish planned checks from completed observations.
        Keep official source, assets, credentials, and raw captures out of this issue. Use public identifiers and concise textual observations.
  - type: input
    id: environment
    attributes:
      label: Client revision and browser environment
      description: Commit, browser version, OS, and relevant configuration.
    validations:
      required: true
  - type: textarea
    id: target
    attributes:
      label: Comparison target and scope
      description: Public reference identifier or server implementation/version, plus the specific behavior under investigation. Exclude private endpoints and credentials.
    validations:
      required: true
  - type: textarea
    id: procedure
    attributes:
      label: Procedure and observations
      description: Reproducible steps and concise textual results. Distinguish proposed checks from completed checks; label synthetic fixtures. Live checks require separate authorization for one attempt with a fixed ledger.
    validations:
      required: true
  - type: textarea
    id: limits
    attributes:
      label: Evidence limits
      description: Separate local comparisons, simulator results, browser execution, and official-server acceptance. State what remains unknown.
    validations:
      required: true
