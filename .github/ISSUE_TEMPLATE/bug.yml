name: Bug report
description: Report a reproducible defect in the browser prototypes.
title: "bug: "
body:
  - type: markdown
    attributes:
      value: |
        Report the specific prototype behavior involved.
        Keep official source, assets, credentials, and raw captures out of this issue. Use textual observations and explicitly labelled synthetic reproducers.
  - type: input
    id: revision
    attributes:
      label: Revision and environment
      description: Commit, OS, Rust/Node versions, and browser version if relevant.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Exact commands or minimal original synthetic steps, including configuration.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
      description: Include concise error text and explain the implemented behavior you expected.
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Verification and limits
      description: Checks run, results, and anything still unverified. Omit credentials and raw payloads.
