name: Bug report
description: Report a reproducible defect in the scaffold or implemented client behavior.
title: "bug: "
body:
  - type: markdown
    attributes:
      value: |
        This project is an unimplemented scaffold. No gameplay or server compatibility is claimed.
        Do not attach official source, translations, challenge snippets, source maps, assets, or raw captures. Use textual observations and explicitly labelled synthetic reproducers.
  - type: input
    id: revision
    attributes:
      label: Revision and environment
      description: Commit, OS, Rust/Node versions, and browser version if relevant.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Exact commands or minimal original synthetic steps, including configuration.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
      description: Include concise error text and explain the implemented behavior you expected.
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Verification and limits
      description: Checks run, results, and anything still unverified. Do not include restricted source or payload captures.
