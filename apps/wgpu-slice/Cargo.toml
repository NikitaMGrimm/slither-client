[package]
name = "slither-wgpu-slice"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "slither-wgpu-desktop"
path = "src/main.rs"

[[bin]]
name = "slither-wgpu-diagnostic"
path = "src/diagnostic_main.rs"

[dependencies]
slither-client = { path = "../.." }
url = "=2.5.8"
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl", "dx12", "vulkan", "webgpu"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }
pollster = "=0.4.0"
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
ureq = { version = "=3.5.0", default-features = false, features = ["rustls", "gzip"] }
scraper = { version = "=0.29.0", default-features = false }
rand = "=0.10.3"
png = "=0.18.1"
fontdue = { version = "=0.9.5", default-features = false, features = ["std"] }
ttf-parser = { version = "=0.25.1", default-features = false, features = ["std"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
js-sys = "=0.3.106"
web-sys = { version = "=0.3.106", features = ["HtmlCanvasElement", "OffscreenCanvas", "OffscreenCanvasRenderingContext2d", "TextMetrics", "ImageData"] }

[profile.dev]
debug = 0

[profile.release]
debug = 0
lto = "thin"
codegen-units = 1

[dev-dependencies]
flate2 = "=1.1.10"
png = "=0.18.1"
serde_json = "=1.0.154"
